<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600" font-family="Segoe UI, Calibri, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><text x="30" y="36" text-anchor="start" font-size="22" font-weight="700" fill="#0F172A">Refill lifecycle: from “box is empty” to “reimbursed”</text><text x="30" y="58" text-anchor="start" font-size="13" font-weight="400" fill="#475569">Happy path runs left to right. Side paths show handoff, budget approval and rejection.</text><rect x="30" y="150" width="150" height="76" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="105.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">BOX EMPTY</text><text x="105.0" y="204" text-anchor="middle" font-size="12" fill="#475569">someone taps “empty”</text><rect x="290" y="150" width="150" height="76" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="365.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">OFFERED</text><text x="365.0" y="204" text-anchor="middle" font-size="12" fill="#475569">one volunteer asked</text><rect x="550" y="150" width="150" height="76" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="625.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">COMMITTED</text><text x="625.0" y="204" text-anchor="middle" font-size="12" fill="#475569">volunteer accepted</text><rect x="810" y="150" width="150" height="76" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="885.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">CLAIMED</text><text x="885.0" y="204" text-anchor="middle" font-size="12" fill="#475569">claim filed in HR</text><rect x="1070" y="150" width="150" height="76" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1145.0" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">REIMBURSED</text><text x="1145.0" y="204" text-anchor="middle" font-size="12" fill="#475569">volunteer paid back</text><path d="M184 188 L286 188" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/><text x="235.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">report_empty</text><text x="235.0" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">(one open refill</text><text x="235.0" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">per office)</text><path d="M444 188 L546 188" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/><text x="495.0" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Accept</text><path d="M704 188 L806 188" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/><text x="755.0" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">receipt sent,</text><text x="755.0" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">budget OK</text><path d="M964 188 L1066 188" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/><text x="1015.0" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">HR approves</text><path d="M625.0 148 C625.0 100 365.0 100 365.0 146" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a)"/><text x="495.0" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">decline  ·  no reply in 4 h  ·  no purchase in 24 h</text><text x="495.0" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">→ next volunteer (earlier ones excluded this round)</text><rect x="290" y="340" width="150" height="76" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/><text x="365.0" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">ADMIN ALERTED</text><text x="365.0" y="394" text-anchor="middle" font-size="12" fill="#475569">retried on next tick</text><rect x="550" y="340" width="150" height="76" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="625.0" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">AWAITING</text><text x="625.0" y="385" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">APPROVAL</text><text x="625.0" y="408" text-anchor="middle" font-size="12" fill="#475569">bought, over budget</text><rect x="810" y="340" width="150" height="76" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="885.0" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">REJECTED</text><text x="885.0" y="394" text-anchor="middle" font-size="12" fill="#475569">volunteer + admin told</text><path d="M365.0 228 L365.0 336" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="373.0" y="285" text-anchor="start" font-size="12" font-weight="400" fill="#475569" font-style="italic">no volunteer left</text><path d="M625.0 228 L625.0 336" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#a)"/><text x="617.0" y="280" text-anchor="end" font-size="12" font-weight="700" fill="#0F172A">over budget:</text><text x="617.0" y="296" text-anchor="end" font-size="12" font-weight="400" fill="#475569">month spend + amount</text><text x="617.0" y="311" text-anchor="end" font-size="12" font-weight="400" fill="#475569">&gt; monthly budget</text><path d="M680 338 L680 285 L840 285 L840 230" fill="none" stroke="#15803D" stroke-width="2.2" marker-end="url(#a)"/><text x="706" y="277" text-anchor="start" font-size="12" font-weight="700" fill="#15803D">admin approves</text><path d="M704 378 L806 378" fill="none" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#a)"/><text x="755.0" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">admin rejects</text><path d="M930 228 L930 336" fill="none" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#a)"/><text x="940" y="280" text-anchor="start" font-size="12" font-weight="700" fill="#B91C1C">HR rejects</text><text x="940" y="296" text-anchor="start" font-size="12" font-weight="400" fill="#475569">(admin alerted)</text><text x="1145.0" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Claim pending &gt; 10 days</text><text x="1145.0" y="384" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">→ admin chases HR once</text><rect x="1062" y="346" width="166" height="52" rx="10" fill="none" stroke="#64748B" stroke-dasharray="6 4"/><rect x="30" y="440" width="1190" height="98" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/><text x="50" y="468" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">Why it can't double-buy</text><text x="50" y="486" text-anchor="start" font-size="12" font-weight="400" fill="#475569">one open refill per office; only the offered</text><text x="50" y="501" text-anchor="start" font-size="12" font-weight="400" fill="#475569">volunteer can accept; atomic transitions</text><text x="445" y="468" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">Who is asked</text><text x="445" y="486" text-anchor="start" font-size="12" font-weight="400" fill="#475569">not waiting for money → fewest refills in 90</text><text x="445" y="501" text-anchor="start" font-size="12" font-weight="400" fill="#475569">days → longest since last buy; away/visiting</text><text x="445" y="516" text-anchor="start" font-size="12" font-weight="400" fill="#475569">skipped</text><text x="840" y="468" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">Budget check</text><text x="840" y="486" text-anchor="start" font-size="12" font-weight="400" fill="#475569">per office and currency; soft limit:</text><text x="840" y="501" text-anchor="start" font-size="12" font-weight="400" fill="#475569">over-budget goes to admin, never silently</text><text x="840" y="516" text-anchor="start" font-size="12" font-weight="400" fill="#475569">refused</text><rect x="30" y="560" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="50" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">waiting on volunteer</text><rect x="222" y="560" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="242" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">needs admin</text><rect x="351" y="560" width="14" height="14" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/><text x="371" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">waiting on HR</text><rect x="494" y="560" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="514" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">done</text><rect x="574" y="560" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="594" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">needs follow-up</text><rect x="731" y="560" width="14" height="14" rx="3" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="751" y="572" text-anchor="start" font-size="12" font-weight="400" fill="#475569">trigger / escalation</text></svg>